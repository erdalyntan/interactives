<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2 Math: Conjugate Root Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true
            },
            options: { enableMenu: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* H2 VECTOR STYLING (9758 STANDARDS) */
        .h2-vector {
            position: relative;
            display: inline-block;
            font-weight: bold;
            font-style: italic;
        }
        .h2-vector::before {
            content: "\2192";
            position: absolute;
            top: -0.75em;
            left: 50%;
            transform: translateX(-50%) scaleX(1.1);
            font-style: normal;
            font-weight: 900;
            color: black;
            font-size: 0.8em;
        }

        /* Argand Diagram */
        #argand-canvas {
            touch-action: none;
            cursor: crosshair;
            background: #ffffff;
            border-radius: 1rem;
            border: 2px solid #f1f5f9;
        }
        .grid-line { stroke: #f1f5f9; stroke-width: 1; }
        .axis-line { stroke: #334155; stroke-width: 2; }
        .point-z1 { fill: #6366f1; }
        .point-zstar { fill: #f43f5e; cursor: grab; filter: drop-shadow(0 0 4px rgba(244, 63, 94, 0.4)); }
        
        .drop-zone {
            min-height: 70px;
            border: 3px dashed #cbd5e1;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            transition: all 0.2s ease-in-out;
        }
        .drop-zone.hover { border-color: #6366f1; background: #eef2ff; transform: scale(1.02); }

        .draggable-pill {
            cursor: grab;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            font-weight: 600;
            user-select: none;
        }

        input {
            transition: all 0.2s;
            border-bottom: 2px solid #e2e8f0;
        }
        input:focus {
            outline: none;
            border-bottom-color: #6366f1;
            transform: translateY(-1px);
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="p-4 md:p-12">

    <div id="app" class="max-w-3xl mx-auto">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Conjugate Root Theorem</h1>
                <p class="text-indigo-300 text-sm font-medium">Interactive H2 Mathematics (9758)</p>
            </div>
            <div id="progress-indicator" class="bg-indigo-500/30 text-white px-4 py-1 rounded-full text-xs font-bold border border-white/20">
                PAGE 0 / 3
            </div>
        </header>

        <div id="main-container" class="glass-card p-8 md:p-12 transition-all duration-500">
            <!-- Content Injected via init() -->
        </div>
    </div>

    <script>
        let state = {
            page: 0,
            z1_re: 2,
            z1_im: 2, 
            user_zstar_re: 0,
            user_zstar_im: 0
        };

        // --- Robust H2 Parser ---
        function parseComplexInput(input) {
            let s = input.toLowerCase().replace(/\s+/g, '');
            if (!s) return null;
            if (s === 'i' || s === '+i') return { re: 0, im: 1 };
            if (s === '-i') return { re: 0, im: -1 };

            if (s.endsWith('i')) {
                let body = s.slice(0, -1);
                let splitIdx = -1;
                for (let i = body.length - 1; i > 0; i--) {
                    if (body[i] === '+' || body[i] === '-') {
                        splitIdx = i; break;
                    }
                }
                if (splitIdx === -1) {
                    if (body === "" || body === "+") return { re: 0, im: 1 };
                    if (body === "-") return { re: 0, im: -1 };
                    return { re: 0, im: parseFloat(body) };
                } else {
                    let rePart = body.slice(0, splitIdx);
                    let imPart = body.slice(splitIdx);
                    let re = parseFloat(rePart);
                    let im = (imPart === "+") ? 1 : (imPart === "-") ? -1 : parseFloat(imPart);
                    return { re, im };
                }
            } else {
                let val = parseFloat(s);
                return isNaN(val) ? null : { re: val, im: 0 };
            }
        }

        function init() { renderPage(); }

        function renderPage() {
            const container = document.getElementById('main-container');
            const indicator = document.getElementById('progress-indicator');
            indicator.innerText = `PAGE ${state.page} / 3`;

            if (state.page === 0) renderSummary(container);
            else if (state.page === 1) renderLogic(container);
            else if (state.page === 2) renderAlgebra(container);
            else if (state.page === 3) renderArgand(container);

            if (window.MathJax) MathJax.typesetPromise();
        }

        function renderSummary(container) {
            container.innerHTML = `
                <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Discovery: Conjugate Root Theorem</h2>
                <div class="space-y-4 mb-10">
                    <div class="border-l-4 border-indigo-500 p-5 bg-indigo-50 rounded-r-xl">
                        <span class="tag bg-indigo-100 text-indigo-700 mb-2 inline-block">The Rule</span>
                        <p class="text-sm">For any polynomial \\( P(z) \\) with <strong>real coefficients</strong>, if a non-real number \\( w \\) is a root, then its conjugate \\( w^* \\) is also a root.</p>
                    </div>
                    <div class="border-l-4 border-pink-500 p-5 bg-pink-50 rounded-r-xl">
                        <span class="tag bg-pink-100 text-pink-700 mb-2 inline-block">Geometric Impact</span>
                        <p class="text-sm">This implies that non-real roots must occur in pairs that are reflections of each other across the <strong>Real Axis</strong>.</p>
                    </div>
                </div>
                <button onclick="state.page=1; renderPage();" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:shadow-xl transition-all shadow-lg">Begin Investigation</button>
            `;
        }

        function renderLogic(container) {
            container.innerHTML = `
                <div class="text-center mb-8">
                    <span class="tag bg-slate-200 text-slate-600">Step 1: Necessary Condition</span>
                    <h2 class="text-xl font-bold mt-2">Check the Condition</h2>
                    <p class="text-slate-500 text-sm">The Conjugate Root Theorem is only valid if the coefficients are in the set:</p>
                </div>
                <div class="flex justify-center mb-12">
                    <div id="dz-logic" class="drop-zone w-72" ondrop="handleDrop(event)" ondragover="allowDrop(event)" ondragleave="handleDragLeave(event)">
                        <span class="text-slate-300 text-sm italic pointer-events-none">Drop correct set here</span>
                    </div>
                </div>
                <div class="flex justify-center gap-6 mb-10">
                    <div class="draggable-pill" draggable="true" ondragstart="handleDrag(event)" data-tex="\\mathbb{R} \\text{ (Real)}" data-val="ok">\\( \\mathbb{R} \\)</div>
                    <div class="draggable-pill" draggable="true" ondragstart="handleDrag(event)" data-tex="\\mathbb{C} \\text{ (Complex)}" data-val="no">\\( \\mathbb{C} \\)</div>
                </div>
                <div id="feedback-1" class="text-center h-4 text-sm font-bold mb-6"></div>
                <button id="next-1" disabled onclick="validateLogic()" class="w-full bg-slate-100 text-slate-400 py-4 rounded-xl font-bold transition-all">Validate Logic</button>
            `;
        }

        function renderAlgebra(container) {
            // Randomize real and imaginary parts (varying coefficients)
            state.z1_re = Math.floor(Math.random() * 4) + 1;
            state.z1_im = Math.floor(Math.random() * 3) + 1; // can be 1, 2, or 3

            let imLabel = state.z1_im === 1 ? "i" : `${state.z1_im}i`;

            container.innerHTML = `
                <div class="text-center mb-8">
                    <span class="tag bg-pink-100 text-pink-700">Step 2: Algebra</span>
                    <h2 class="text-xl font-bold mt-2">State the Partner Root</h2>
                    <p class="text-slate-500 text-sm">Given \\( z_1 = ${state.z1_re} + ${imLabel} \\) is a root of a real-coefficient polynomial.</p>
                </div>
                <div class="bg-slate-50 p-8 rounded-2xl border border-slate-200 mb-8 text-center">
                    <p class="text-slate-600 mb-4">Identify the second root \\( z_1^* \\):</p>
                    <div class="flex justify-center items-center gap-4">
                        <span class="text-2xl font-serif">\\( z_1^* = \\)</span>
                        <input id="zstar-input" type="text" class="w-44 bg-transparent border-b-2 border-slate-400 text-center text-2xl font-bold py-1 focus:border-indigo-500 transition-colors" placeholder="a + bi form">
                    </div>
                </div>
                <div id="feedback-2" class="text-center h-4 text-sm font-bold mb-6 text-pink-600"></div>
                <button onclick="validateAlgebra()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-lg">Check Root</button>
            `;
        }

        function renderArgand(container) {
            container.innerHTML = `
                <div class="text-center mb-6">
                    <span class="tag bg-amber-100 text-amber-700">Step 3: Geometry</span>
                    <h2 class="text-xl font-bold mt-2">Argand Diagram Reflection</h2>
                    <p class="text-slate-500 text-sm">Drag the <span class="text-rose-500 font-bold">Red Root (z₁*)</span> to the correct reflection point.</p>
                </div>
                <div class="flex flex-col items-center">
                    <svg id="argand-canvas" width="320" height="320" viewBox="0 0 320 320">
                        ${Array.from({length: 11}, (_, i) => `<line class="grid-line" x1="${i*32}" y1="0" x2="${i*32}" y2="320" /><line class="grid-line" x1="0" y1="${i*32}" x2="320" y2="${i*32}" />`).join('')}
                        <line class="axis-line" x1="0" y1="160" x2="320" y2="160" /><line class="axis-line" x1="160" y1="0" x2="160" y2="320" />
                        <text x="300" y="150" font-size="12" font-weight="bold" fill="#64748b">Re</text><text x="170" y="20" font-size="12" font-weight="bold" fill="#64748b">Im</text>
                        
                        <circle cx="${160 + state.z1_re*32}" cy="${160 - state.z1_im*32}" r="7" fill="#6366f1" />
                        <text x="${165 + state.z1_re*32}" y="${150 - state.z1_im*32}" font-size="14" font-weight="bold" fill="#4338ca">z₁</text>
                        
                        <g id="drag-group" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">
                            <circle id="drag-zstar" cx="160" cy="160" r="10" class="point-zstar" />
                            <text id="drag-label" x="170" y="175" font-size="14" font-weight="bold" fill="#f43f5e">z₁*</text>
                        </g>
                    </svg>
                    <div class="mt-8 p-5 bg-slate-100 rounded-xl w-full flex justify-between items-center px-6 border border-slate-200">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-tighter">Current Location:</div>
                        <div id="coord-display" class="text-xl font-mono font-bold text-rose-600">0 + 0i</div>
                    </div>
                </div>
                <button onclick="validateArgand()" class="w-full bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg mt-8 hover:bg-amber-600 transition-colors">Finalize Investigation</button>
            `;
            updateDisplay();
        }

        // --- Interaction Logic ---

        function handleDrag(ev) {
            ev.dataTransfer.setData("tex", ev.target.dataset.tex);
            ev.dataTransfer.setData("val", ev.target.dataset.val);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('hover');
        }

        function handleDragLeave(ev) {
            ev.currentTarget.classList.remove('hover');
        }

        function handleDrop(ev) {
            ev.preventDefault();
            const dz = ev.currentTarget; 
            dz.classList.remove('hover');
            const tex = ev.dataTransfer.getData("tex");
            const val = ev.dataTransfer.getData("val");
            dz.innerHTML = `\\( ${tex} \\)`;
            dz.dataset.val = val;
            const btn = document.getElementById('next-1');
            btn.disabled = false;
            btn.className = "w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-lg transition-all";
            if (window.MathJax) MathJax.typesetPromise([dz]);
        }

        function validateLogic() {
            const dz = document.getElementById('dz-logic');
            if (dz.dataset.val === 'ok') {
                state.page = 2; renderPage();
            } else {
                const fb = document.getElementById('feedback-1');
                fb.innerText = "Theorem invalid for non-real coefficients!";
                fb.style.color = "#ef4444";
            }
        }

        function validateAlgebra() {
            const userInput = document.getElementById('zstar-input').value;
            const res = parseComplexInput(userInput);
            const fb = document.getElementById('feedback-2');
            
            if (res && res.re === state.z1_re && res.im === -state.z1_im) {
                fb.innerText = "Perfect! Conjugate identified.";
                fb.style.color = "#10b981";
                setTimeout(() => { state.page = 3; renderPage(); }, 800);
            } else {
                fb.innerText = "Check your conjugate signs or real part.";
                fb.style.color = "#ef4444";
            }
        }

        let dragging = false;
        function startDrag(e) { dragging = true; window.addEventListener('mousemove', doDrag); window.addEventListener('mouseup', endDrag); window.addEventListener('touchmove', doDrag); window.addEventListener('touchend', endDrag); }
        function doDrag(e) {
            if (!dragging) return;
            const svg = document.getElementById('argand-canvas');
            const pt = svg.createSVGPoint();
            pt.x = e.touches ? e.touches[0].clientX : e.clientX;
            pt.y = e.touches ? e.touches[0].clientY : e.clientY;
            const cursor = pt.matrixTransform(svg.getScreenCTM().inverse());
            let gx = Math.round((cursor.x - 160) / 32);
            let gy = Math.round((160 - cursor.y) / 32);
            gx = Math.max(-5, Math.min(5, gx));
            gy = Math.max(-5, Math.min(5, gy));
            state.user_zstar_re = gx;
            state.user_zstar_im = gy;
            document.getElementById('drag-zstar').setAttribute('cx', 160 + gx * 32);
            document.getElementById('drag-zstar').setAttribute('cy', 160 - gy * 32);
            document.getElementById('drag-label').setAttribute('x', 170 + gx * 32);
            document.getElementById('drag-label').setAttribute('y', 155 - gy * 32);
            updateDisplay();
        }
        function endDrag() { dragging = false; }

        function updateDisplay() {
            const disp = document.getElementById('coord-display');
            const re = state.user_zstar_re;
            const im = state.user_zstar_im;
            let str = "";
            if (re === 0 && im === 0) str = "0";
            else if (re !== 0) {
                str = re.toString();
                if (im > 0) str += im === 1 ? " + i" : ` + ${im}i`;
                else if (im < 0) str += im === -1 ? " - i" : ` - ${Math.abs(im)}i`;
            } else {
                if (im === 1) str = "i"; else if (im === -1) str = "-i"; else str = im + "i";
            }
            disp.innerText = str;
        }

        function validateArgand() {
            if (state.user_zstar_re === state.z1_re && state.user_zstar_im === -state.z1_im) {
                showSuccess();
            } else {
                alert("The roots must be reflections across the Real axis!");
            }
        }

        function showSuccess() {
            document.getElementById('main-container').innerHTML = `
                <div class="text-center py-8">
                    <div class="text-6xl mb-6">🏆</div>
                    <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Concept Mastered!</h2>
                    <p class="text-slate-500 mb-8 px-6">You have successfully linked the algebraic definition of a conjugate root to its geometrical representation.</p>
                    <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 inline-block text-left mb-8 shadow-inner">
                        <p class="text-xs font-bold text-indigo-900 mb-3 underline uppercase tracking-widest">H2 9758 Summary:</p>
                        <ul class="text-sm space-y-3 text-indigo-900">
                            <li>• Root \\( z \\) and \\( z^* \\) are symmetric about the Real axis.</li>
                            <li>• Sum \\( z+z^* = 2\\text{Re}(z) \\) (Always Real).</li>
                            <li>• Position vector <span class="h2-vector">OZ</span>\\(_1^*\\) is a reflection of <span class="h2-vector">OZ</span>\\(_1\\).</li>
                        </ul>
                    </div>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg">New Problem</button>
                </div>
            `;
            MathJax.typesetPromise();
        }

        window.onload = init;
    </script>
</body>
</html>
